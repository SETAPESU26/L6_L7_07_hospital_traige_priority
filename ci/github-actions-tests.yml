name: Lab verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run all tests
        run: python -m pytest -q
      - name: Enforce Lab 6 coverage
        working-directory: Lab 6
        run: |
          python -m coverage run --branch --source=hospital_triage_priority -m pytest CodeCoverageTest_hospital_triage_priority.py BranchCoverageTest_hospital_triage_priority.py -q
          python -m coverage report -m --fail-under=90
          python -m coverage json -o coverage.json
          python -c "import json; t=json.load(open('coverage.json'))['totals']; assert t['covered_branches']/t['num_branches'] >= .9"
